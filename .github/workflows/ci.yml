name: Nestlet checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install PDF text tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils fonts-noto-cjk
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Check JavaScript
        run: npm run check
      - name: Build JavaScript React frontend
        run: npm run build
      - name: Test frontend API and build contracts
        run: npm run test:frontend
      - name: Test local behavior
        run: npm test
      - name: Test email contracts with explicitly simulated mail transport
        run: npm run test:email-contracts
      - name: Test artifact invalidation with actual HTTP and DOM events
        run: node --test test/artifact-invalidation.integration.test.js
