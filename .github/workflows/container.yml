name: Nestlet container smoke
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COMPOSE_PROJECT_NAME: nestlet-container-ci
      NESTLET_IMAGE_TAG: ci
      PUBLIC_ORIGIN: https://nestlet.invalid
      NESTLET_OPERATOR_PASSWORD_HASH: ''
      ENABLE_LIVE_AI: 'true'
      # Public test sentinel, never a real credential; requests must fail before provider access.
      DEEPSEEK_API_KEY: ci-public-nonsecret-sentinel
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Reproduce private-permission release checkout
        run: |
          chmod 600 Dockerfile .dockerignore package.json package-lock.json server.js auth.js storage.js workbook-worker.js
          find public scripts ops -type d -exec chmod 700 {} +
          find public scripts ops -type f -exec chmod 600 {} +
      - name: Validate Compose and build actual image
        run: |
          docker compose config --quiet
          docker compose build --pull
      - name: Check helper module readability for root and arbitrary owner UID
        run: |
          for owner in 0:0 12345:12345; do
            docker run --rm --pull never --network none --read-only \
              --cap-drop ALL --security-opt no-new-privileges:true \
              --user "$owner" nestlet:ci \
              node --input-type=module -e "await import('/app/scripts/operator-setup.js'); await import('node:fs/promises').then(fs => fs.readFile('/app/scripts/setup-operator.js'));"
          done
      - name: Exercise disposable Docker helper through a real terminal
        run: python3 ops/helper-docker-pty.py nestlet:ci
      - name: Start loopback-only runtime
        run: docker compose up -d --no-build --wait --wait-timeout 90
      - name: Check published address and host health
        shell: bash
        run: |
          set -euo pipefail
          test "$(docker compose port nestlet 4173)" = '127.0.0.1:4173'
          test "$(docker inspect --format '{{.HostConfig.ReadonlyRootfs}}' "$(docker compose ps -q nestlet)")" = 'true'
          docker inspect --format '{{json .Mounts}}' "$(docker compose ps -q nestlet)" | python3 -c 'import json,sys; m=[v for v in json.load(sys.stdin) if v["Type"]!="tmpfs"]; assert len(m)==1; assert m[0]["Type"]=="volume" and m[0]["Name"]=="nestlet-container-ci_case_data" and m[0]["Destination"]=="/data" and m[0]["RW"] is True'
          curl --fail --silent --show-error http://127.0.0.1:4173/api/health | python3 -c 'import json,sys; assert json.load(sys.stdin)=={"ok":True}'
      - name: Check runtime dependencies and fail-closed endpoints
        run: docker compose exec -T nestlet node --input-type=module < ops/container-smoke.mjs
      - name: Write disposable SQLite persistence fixture
        run: docker compose exec -T nestlet node --input-type=module - write < ops/container-sqlite-smoke.mjs
      - name: Recreate only the CI service and verify persisted SQLite data
        run: |
          docker compose up -d --no-build --pull never --force-recreate --wait --wait-timeout 90 nestlet
          docker compose exec -T nestlet node --input-type=module - read < ops/container-sqlite-smoke.mjs
          docker compose exec -T nestlet node --input-type=module < ops/container-smoke.mjs
      - name: Clean up CI-only container
        if: always()
        run: docker compose down --volumes --remove-orphans
