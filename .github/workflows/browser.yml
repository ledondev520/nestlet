name: Nestlet browser acceptance
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      # The product lifecycle must run at the promoted default homepage.
      NESTLET_BROWSER_ENTRY_PATH: '/'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked application and test dependencies
        run: npm ci --ignore-scripts
      - name: Install official Chromium for the locked Playwright version
        run: npx --no-install playwright install --with-deps chromium
      - name: Install the actual PDF text parser
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils
      - name: Build the production frontend
        run: npm run build
      - name: Verify the disposable backend fixture over real HTTP
        run: |
          node test/frontend-browser/fixture.check.mjs
          node test/frontend-browser/formats-fixture.check.mjs
      - name: Run real-browser journeys against disposable Node and SQLite
        run: npm run test:browser:frontend
      - name: Describe the exact acceptance boundary
        if: always()
        run: |
          {
            echo '### Non-provider browser acceptance'
            echo "Commit: $GITHUB_SHA"
            echo "Product entry: $NESTLET_BROWSER_ENTRY_PATH"
            echo 'This job uses built frontend assets, real HTTP, real SQLite, and synthetic disposable accounts/files.'
            echo 'Read the test result for pass/fail. A component-only pass does not establish the product journeys.'
            echo 'Live DeepSeek extraction/chat/vision, email delivery, service-restart browser recovery, and production deployment are NOT RUN by this job.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Retain synthetic browser report and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-acceptance-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
