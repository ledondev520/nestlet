# Host-local app only. Public ingress must terminate HTTPS; the app must authenticate operators.
# Run from this directory: docker compose --env-file .env up --build -d
services:
  nestlet:
    build:
      context: .
      dockerfile: Dockerfile
    image: nestlet:${NESTLET_IMAGE_TAG:-local}
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:4173:4173"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "4173"
      NESTLET_DB_PATH: /data/nestlet.sqlite
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://127.0.0.1:4173}
      # Single-quote the scrypt hash in .env to preserve literal dollar signs.
      # Empty means authentication is unconfigured: paid AI and settings stay disabled.
      NESTLET_OPERATOR_PASSWORD_HASH: ${NESTLET_OPERATOR_PASSWORD_HASH:-}
      NESTLET_OPERATOR_USERNAME: ${NESTLET_OPERATOR_USERNAME:-owner}
      # Existing Alibaba DirectMail service, injected privately by the operator.
      # Empty configuration disables enrollment/recovery without fabricating delivery.
      ALIBABA_CLOUD_ACCESS_KEY_ID: ${ALIBABA_CLOUD_ACCESS_KEY_ID:-}
      ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${ALIBABA_CLOUD_ACCESS_KEY_SECRET:-}
      ALIBABA_CLOUD_SECURITY_TOKEN: ${ALIBABA_CLOUD_SECURITY_TOKEN:-}
      NESTLET_EMAIL_FROM: ${NESTLET_EMAIL_FROM:-}
      DEEPSEEK_MODEL: deepseek-flash
      ENABLE_LIVE_AI: ${ENABLE_LIVE_AI:-false}
      # Optional server-provided key. Prefer the authenticated, RAM-only settings flow.
      # Never bake keys into this file or an image; do not share rendered Compose config.
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
    volumes:
      - case_data:/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 96
    mem_limit: 768m
    cpus: 1.0
    ulimits:
      core: 0
      nofile:
        soft: 1024
        hard: 1024
    stop_grace_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

# Project-scoped, dedicated storage. Production: never use `down --volumes` or prune.
volumes:
  case_data:
    labels:
      com.nestlet.purpose: private-case-storage
